<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$ - neversleeps.moscow</title>
  <link rel="stylesheet" href="/index.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true },
      sequence: { 
        useMaxWidth: true, 
        actorMargin: 100, 
        messageMargin: 40,
        boxMargin: 10,
        fontFamily: 'inherit'
      },
      gantt: { useMaxWidth: true },
      themeVariables: {
        fontSize: '18px',
        actorFontSize: '18px',
        noteFontSize: '16px',
        messageFontSize: '16px'
      }
    });

    (async () => {
      // Handle Pandoc's default output for mermaid code blocks: <pre class="mermaid"><code>...</code></pre>
      document.querySelectorAll('pre.mermaid > code').forEach((codeBlock) => {
        const pre = codeBlock.parentNode;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeBlock.textContent;
        pre.parentNode.replaceChild(div, pre);
      });
      await mermaid.run();
    })();
  </script>
</head>
<body>
  <header id="main-header">
    <h1 class="title"><a href="/">neversleeps.moscow</a></h1>
    <p class="author">by Nickita Biryulin</p>
  </header>
  $body$
</body>
</html>
